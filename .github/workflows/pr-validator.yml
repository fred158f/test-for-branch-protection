name: PR Validator
on: 
    pull_request:
        types: [opened, synchronize]

jobs:
    validate-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Check PR Title format
              run: |
                    PR_TITLE="${{ github.event.pull_request.title }}"

                    MATCH='^(Feature|Bugfix|Hotfix): [a-zA-Z0-9-]+$'

                    if [[ ! "$PR_TITLE" =~ $MATCH ]]; then
                        echo "pull request title must follow format: feature/branch-name or bugfix/branch-name"
                        echo "incorrect name: ${PR_TITLE}"
                        exit 1
                    fi
                    


        